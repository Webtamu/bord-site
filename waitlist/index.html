<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join the waitlist · bord</title>
  <meta name="description" content="bord is almost here. Send us an email to join the waitlist and we'll let you know the day it launches." />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=20260914" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css?v=20260913" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--cover); color: var(--ink);
      font: 16px/1.6 Inter, -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    .top { width: 100%; max-width: 520px; margin: 0 auto; padding: 28px 24px 0; }
    .top a { color: var(--ink); text-decoration: none; font: 600 22px/1 "Source Serif 4", Georgia, serif; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px 16px 72px; }
    .card {
      width: 100%; max-width: 460px; text-align: center;
      background: var(--paper); border-radius: 6px; box-shadow: 0 10px 30px var(--lift);
      padding: 44px 40px 36px;
      animation: rise .5s cubic-bezier(.2, 0, 0, 1) both;
    }
    .bord { width: 72px; height: 72px; margin: 0 auto 18px; display: block; transform: rotate(-5deg); filter: drop-shadow(0 4px 8px var(--lift)); }
    h1 { font: 600 34px/1.12 "Source Serif 4", Georgia, serif; letter-spacing: -0.015em; margin: 0 0 12px; }
    .lede { color: var(--ink-body); margin: 0 auto 28px; max-width: 34ch; }
    .btn {
      display: block; background: var(--accent); color: #fff; text-decoration: none;
      font-weight: 600; padding: 15px 20px; border-radius: 999px;
      transition: transform .15s ease, background .15s ease;
    }
    .btn:hover { background: var(--accent-deep); }
    .btn:active { transform: scale(.98); }
    .addr { margin: 16px 0 0; font-size: 14px; color: var(--ink-soft); }
    .copy {
      font: inherit; color: var(--accent); background: none; border: 0; padding: 4px 2px; cursor: pointer;
      text-decoration: underline; text-underline-offset: 2px;
    }
    .note { margin: 22px 0 0; padding-top: 18px; border-top: 1px solid var(--hairline); font-size: 13px; color: var(--ink-soft); }
    .back { display: inline-block; font-size: 14px; color: var(--ink-body); }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
    @media (max-width: 520px) { .card { padding: 36px 24px 30px; } h1 { font-size: 29px; } }
  </style>
</head>
<body>
  <div class="top"><a href="../">bord</a></div>

  <main>
    <div class="card">
      <img class="bord" src="../img/bord-face.svg" alt="" aria-hidden="true" />
      <h1>We&rsquo;re almost here.</h1>
      <p class="lede">We&rsquo;re actively working towards launch! Send us an email to join the
        waitlist, and we&rsquo;ll let you know the day bord is out.</p>

      <a class="btn" id="mail" href="mailto:waitlist@bordgame.app?subject=Join%20the%20bord%20waitlist&amp;body=Hi%20bord%2C%20add%20me%20to%20the%20waitlist!">Email us to join the waitlist</a>

      <p class="addr">or write to <strong>waitlist@bordgame.app</strong>
        &middot; <button class="copy" id="copy" type="button">Copy</button></p>

      <p class="note">One email when we launch. Nothing else.</p>
    </div>
    <a class="back" href="../">&larr; Back to bord</a>
  </main>

  <script>
    // Which badge brought them here (?from=ios|android) goes in the subject,
    // so we know which store to tell them about.
    (function () {
      var from = new URLSearchParams(location.search).get("from");
      var label = from === "ios" ? "iPhone" : from === "android" ? "Android" : null;
      var mail = document.getElementById("mail");
      if (label) mail.href = mail.href.replace("Join%20the%20bord%20waitlist", "Join%20the%20bord%20waitlist%20(" + label + ")");
      var copy = document.getElementById("copy");
      copy.addEventListener("click", function () {
        var done = function () { copy.textContent = "Copied"; setTimeout(function () { copy.textContent = "Copy"; }, 1600); };
        if (navigator.clipboard) navigator.clipboard.writeText("waitlist@bordgame.app").then(done, function () {});
      });
    })();
  </script>
</body>
</html>

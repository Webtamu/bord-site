<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're invited · BORD</title>
<meta property="og:title" content="Your first drink's on them">
<meta property="og:description" content="A seat at a live Catan table — first boba covered. That's the invite.">
<style>
  :root { --linen:#F5F2EC; --ink:#1A1714; --cobalt:#2743D6; --stone:#8A837A; --spruce:#275D43; }
  * { margin:0; box-sizing:border-box; }
  body { background:var(--linen); color:var(--ink);
    font:16px/1.5 -apple-system, system-ui, sans-serif;
    min-height:100svh; display:flex; align-items:center; justify-content:center; padding:28px; }
  main { max-width:420px; width:100%; }
  h1 { font-family: "New York", Georgia, serif; font-size:34px; line-height:1.1; margin-bottom:10px; }
  .sub { color:var(--stone); margin-bottom:28px; }
  .code { font-family: ui-monospace, SFMono-Regular, monospace; font-weight:700;
    font-size:28px; letter-spacing:1px; background:#fff; border:1px solid rgba(0,0,0,.08);
    border-radius:18px; padding:18px 22px; text-align:center; margin-bottom:14px; }
  button, .cta { display:block; width:100%; border:0; cursor:pointer; text-align:center;
    background:var(--cobalt); color:#fff; font-size:16px; font-weight:600;
    padding:16px; border-radius:99px; text-decoration:none; }
  .ghost { background:none; color:var(--stone); font-size:13px; font-weight:600;
    margin-top:14px; }
  .fine { color:var(--stone); font-size:12px; margin-top:22px; text-align:center; }
</style>
</head>
<body>
<main>
  <h1>Your first drink's<br>on your friend.</h1>
  <p class="sub">A seat at a live Catan table, boba covered, players verified. That's the invite.</p>
  <div class="code" id="code">····</div>
  <button id="copy">Copy code &amp; get BORD</button>
  <p class="fine">Enter the code when you sign up — the drink attaches itself.</p>
</main>
<script>
(function () {
  // /i/{code} via the 404 redirect, or ?c= directly
  var params = new URLSearchParams(location.search);
  var code = (params.get("c") || location.pathname.split("/i/")[1] || "")
    .replace(/\/+$/, "").toLowerCase();
  if (!code) { location.replace("https://bordgame.app/"); return; }
  document.getElementById("code").textContent = code;

  // count the click (aggregate only; RLS allows anon insert on link_clicks)
  // Filled in by .github/workflows/links-deploy.yml from repo secrets.
  var SUPABASE_URL = "https://polxedjpnuewjcuxhkzw.supabase.co";
  var SUPABASE_ANON = "__SUPABASE_ANON_KEY__";
  if (SUPABASE_URL.indexOf("__") === 0) SUPABASE_URL = "";
  if (SUPABASE_URL && SUPABASE_ANON) {
    fetch(SUPABASE_URL + "/rest/v1/link_clicks", {
      method: "POST",
      headers: { "content-type": "application/json", apikey: SUPABASE_ANON,
                 authorization: "Bearer " + SUPABASE_ANON },
      body: JSON.stringify({ path: "/i/", code: code,
        src: params.get("src") || null,
        ua_class: /iPhone|iPad/.test(navigator.userAgent) ? "ios"
                 : /Android/.test(navigator.userAgent) ? "android" : "web" })
    }).catch(function () {});
  }

  // With the app installed, iOS opens /i/{code} in the app directly (a
  // Universal Link) and this page never shows. Without it: copy the code,
  // then go get the app.
  document.getElementById("copy").addEventListener("click", function () {
    if (navigator.clipboard) navigator.clipboard.writeText(code).catch(function () {});
    location.href = "https://bordgame.app/"; // repo variable APP_STORE_URL; bordgame.app until the app is listed
  });
})();
</script>
</body>
</html>
